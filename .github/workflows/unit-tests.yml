name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          # Pinned, so a version that cannot be resolved is this line
          # rather than an outage. Unpinned, one failed lookup upstream
          # took out every workflow at once — nothing gets past this
          # step, so it reads as the tests being broken. Matches what
          # the project is developed against; bumping it is deliberate.
          just-version: 1.52.0

      - name: Check unit coverage
        run: just coverage-unit
