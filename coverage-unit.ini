# Coverage config for `just coverage-unit` only. gandalf.testing is the
# functional-test-facing API: the unit suite never imports it, so it is
# measured (to 100%) by `just coverage-functional` instead. The pytest
# plugin is omitted for the same reason it is omitted in pyproject.toml —
# it loads before coverage starts.
[run]
branch = True
source = gandalf
omit =
    gandalf/testing.py
    gandalf/pytest_plugin.py

[report]
fail_under = 100
show_missing = True
