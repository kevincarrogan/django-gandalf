{% extends "testapp/base.html" %}

{% block template_name %}testapp/linear_wizard.html{% endblock %}

{% block content %}
    <div class="card">
        {% if request.run.back_url %}
            <p><a href="{{ request.run.back_url }}">Back</a></p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Continue</button>
        </form>
    </div>
{% endblock %}
