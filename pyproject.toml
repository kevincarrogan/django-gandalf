[project]
name = "django-gandalf"
version = "0.29.0"
description = "A framework for building form wizards using Django forms"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kevin Carrogan", email = "kevin@carrogan.com" },
]
keywords = ["django", "forms", "form-wizard", "multi-step", "wizard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "django>=4.2,<6.1",
]

# `gandalf.contrib.agent` only. The core stays on Django alone — a wizard
# library should not make you install an AI SDK to render a form.
#
# No provider is named here on purpose. This brings the agent machinery
# and the AG-UI transport; which model serves it is yours to choose:
#
#     pip install django-gandalf[agent] "pydantic-ai-slim[openai]"
[project.optional-dependencies]
agent = [
  "pydantic-ai-slim[ag-ui]~=2.30",
]

[project.entry-points.pytest11]
gandalf = "gandalf.pytest_plugin"

[project.urls]
Homepage = "https://github.com/kevincarrogan/django-gandalf"
Repository = "https://github.com/kevincarrogan/django-gandalf"
Issues = "https://github.com/kevincarrogan/django-gandalf/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gandalf"]

[tool.hatch.build.targets.sdist]
include = [
  "/gandalf",
  "/tests",
  "/AGENT_ACCESS.md",
  "/ARCHITECTURE.md",
  "/CONTRIBUTING.md",
  "/README.md",
]

[dependency-groups]
agents = [
    "pydantic-ai-slim[ag-ui,anthropic]~=2.30",
    "pydantic-evals>=2.30.0",
    "uvicorn~=0.52.3",
]
dev = [
    "ipdb~=0.13.13",
    "pytest~=8.3.5",
    "pytest-cov~=7.1.0",
    "pytest-django~=4.11.1",
    "pytest-sugar~=1.1.1",
]
lint = [
    # django-stubs tracks Django's own version line: 6.0.x carries the stubs
    # for Django 6.0, the newest release in the supported range.
    "django-stubs~=6.0.7",
    "mypy~=2.3.0",
    "pre-commit~=4.1.0",
    "ruff~=0.9.10",
]

[tool.mypy]
files = ["gandalf"]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true

# `runtime.py` is the walk: a lockstep traversal over two structures whose
# shapes are only known positionally, plus the JSON state those produce.
# Its signatures are annotated, but the internals stay lenient rather than
# pay for the casts full strictness would need.
[[tool.mypy.overrides]]
module = "gandalf.runtime"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
pythonpath = "."
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["gandalf"]
# The pytest11 plugin is imported at pytest bootstrap, before coverage
# starts, so its module-level lines can never be measured. It holds no
# logic — everything it exposes delegates to gandalf.testing, which the
# functional suite covers in full.
# gandalf/driver.py is the mirror of gandalf/testing.py's arrangement:
# the programmatic-driver API is measured (to 100%) by `just coverage-unit`
# instead, and the functional suite proves it end-to-end over the README
# wizards without re-proving every branch.
# `gandalf.contrib.agent` follows driver.py's arrangement for the same
# reason: its toolset, prompt and profile are pure Python over the driver
# and are measured (to 100%) by `just coverage-unit`. Its `agui` module is
# the exception and is *not* omitted here — an endpoint that streams over
# ASGI can only honestly be covered by a real request, which is this
# suite's job. The package `__init__` is here too now that it carries the
# lazy-import hook that keeps a profile free of the extra.
# gandalf/file_storage.py is here for driver.py's reason. `StoredUpload`
# is a file object, and the branches that decide what to do with a handle
# nothing has fetched yet — rewinding it, closing it — are not reachable
# over HTTP: Django closes `request.FILES` only on a real request, and a
# real request carries live uploads rather than stored ones. The unit
# suite measures them (to 100%); this suite proves the parts a request
# does reach — that replaying an answered step fetches nothing, and that a
# validator or a `done()` that reads the bytes still gets them.
omit = [
  "gandalf/pytest_plugin.py",
  "gandalf/driver.py",
  "gandalf/file_storage.py",
  "gandalf/contrib/agent/__init__.py",
  "gandalf/contrib/agent/deps.py",
  "gandalf/contrib/agent/profile.py",
  "gandalf/contrib/agent/prompt.py",
  "gandalf/contrib/agent/toolset.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
