[project]
name = "django-gandalf"
version = "0.7.0"
description = "A framework for building form wizards using Django forms"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kevin Carrogan", email = "kevin@carrogan.com" },
]
keywords = ["django", "forms", "form-wizard", "multi-step", "wizard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "django>=4.2,<6.1",
]

[project.entry-points.pytest11]
gandalf = "gandalf.pytest_plugin"

[project.urls]
Homepage = "https://github.com/kevincarrogan/django-gandalf"
Repository = "https://github.com/kevincarrogan/django-gandalf"
Issues = "https://github.com/kevincarrogan/django-gandalf/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gandalf"]

[tool.hatch.build.targets.sdist]
include = [
  "/gandalf",
  "/tests",
  "/ARCHITECTURE.md",
  "/CONTRIBUTING.md",
  "/README.md",
]

[dependency-groups]
dev = [
    "ipdb~=0.13.13",
    "pytest~=8.3.5",
    "pytest-cov~=7.1.0",
    "pytest-django~=4.11.1",
    "pytest-sugar~=1.1.1",
]
lint = [
    "pre-commit~=4.1.0",
    "ruff~=0.9.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
pythonpath = "."
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["gandalf"]
# The pytest11 plugin is imported at pytest bootstrap, before coverage
# starts, so its module-level lines can never be measured. It holds no
# logic — everything it exposes delegates to gandalf.testing, which the
# functional suite covers in full.
omit = ["gandalf/pytest_plugin.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
